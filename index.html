    <!--
      THESIS: The answer and its proof are one object — each quote is filed as a folder tab labelled with its
      page. Refuses the chat-transcript column and the centered upload form.
      OWN-WORLD: Filmic near-black ground (#161714, a breath of olive). Four pastel tiles with roles: lime =
      answer, coral = voice, teal = documents, sage = proof. Folder-tab silhouettes, 28px radii, layered soft
      drop shadows. Unbounded display, Onest UI, JetBrains Mono only for measurements. Phosphor icons in ink discs.
      STORY: Upload a manual, press the coral mic, hear a short answer, see the quote filed under its page,
      check what it cost in time and money.
      FIRST VIEWPORT: 12-column bento at 1280px. Coral voice tile (cols 1-4) with a 104px ink mic disc and the
      language switch; teal documents tile (cols 5-12, top); lime answer tile (cols 5-12, largest); proof tabs
      beneath it; measurements tile under the voice tile.
      FORM: bento dashboard from the user-pinned reference (pinned brief; no roll, no seed).
      FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict,
      DESIGN.md, and every shipping raster carrying its provenance
    -->
    <div id="root"></div>
    <script type="module" src="/src/web/main.tsx"></script>
  </body>
